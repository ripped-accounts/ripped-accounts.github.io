<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>bluebook.ink — Register</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: sans-serif; background:#111; color:#eee; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#1a1a1a; border:1px solid #333; border-radius:10px; padding:32px; width:340px; }
  .logo-line { font-size:22px; font-weight:700; margin-bottom:20px; }
  .logo-line .b { color:#60a5fa; }
  .logo-line .i { color:#fff; }
  h2 { margin:0 0 4px; font-size:18px; }
  .sub { font-size:13px; color:#666; margin:4px 0 20px; }
  label { display:block; font-size:12px; color:#999; margin-bottom:5px; text-transform:uppercase; }
  input { width:100%; box-sizing:border-box; background:#111; border:1px solid #333; border-radius:6px; padding:10px; color:#eee; font-size:14px; margin-bottom:14px; outline:none; }
  input:focus { border-color:#6c6cff; }
  button { width:100%; padding:11px; background:#6c6cff; border:none; border-radius:6px; color:#fff; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px; }
  button:hover { background:#5a5ae6; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .err { color:#ff5c7a; font-size:13px; margin-bottom:12px; display:none; }
  .success { background:#111; border:1px solid #333; border-radius:8px; padding:20px; margin-top:4px; font-size:14px; line-height:1.6; display:none; }
  .links { margin-top:16px; text-align:center; font-size:13px; color:#666; }
  .links a { color:#6c6cff; text-decoration:none; }
  .links a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-line"><span class="b">bluebook</span><span class="i">.ink</span></div>
  <h2>Create account</h2>
  <p class="sub">Sign up, then contact the owner to get access activated.</p>

  <div id="errMsg" class="err"></div>

  <div id="formView">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com"/>
    <label>Password</label>
    <input type="password" id="pass" placeholder="Choose a password"/>
    <label>Confirm Password</label>
    <input type="password" id="pass2" placeholder="Repeat password"/>
    <button id="regBtn" onclick="doRegister()">Create Account</button>
  </div>

  <div class="success" id="successView">
    <span style="color:#5cfc9a;font-weight:600;">✓ Account created!</span><br><br>
    Your account is registered. Access is assigned manually — contact the owner to get activated.<br><br>
    Once activated, <a href="login.html" style="color:#6c6cff;">sign in here</a>.
  </div>

  <div class="links"><a href="login.html">Already have an account? Sign in</a></div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://pxpqakbjqtqpifbhkyus.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4cHFha2JqcXRxcGlmYmhreXVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MDI1MjEsImV4cCI6MjEwMTk3ODUyMX0.gA0FrkvsqLV-lYeGSpEfAB3NPeS3wdmwtmStLqkWenQ'
);

function showErr(msg) { const el=document.getElementById('errMsg'); el.textContent=msg; el.style.display='block'; }
function clearErr() { document.getElementById('errMsg').style.display='none'; }

async function doRegister() {
  clearErr();
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  const pass2 = document.getElementById('pass2').value;
  if (!email || !pass) { showErr('Enter your email and a password.'); return; }
  if (pass !== pass2)  { showErr('Passwords do not match.'); return; }
  if (pass.length < 6) { showErr('Password must be at least 6 characters.'); return; }

  const btn = document.getElementById('regBtn');
  btn.disabled=true; btn.textContent='Creating...';
  const { error } = await sb.auth.signUp({ email, password: pass });
  btn.disabled=false; btn.textContent='Create Account';

  if (error) { showErr(error.message); return; }
  document.getElementById('formView').style.display='none';
  document.getElementById('successView').style.display='block';
}

document.getElementById('pass2').addEventListener('keydown', e => { if (e.key==='Enter') doRegister(); });
</script>
</body>
</html>
